name: "Run jPOS Tests"
on:
  push:
    branches: [ tail ]
  pull_request:
    branches: [ tail ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 11 ]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        distribution: 'corretto'
        java-version: ${{ matrix.java }}
        cache: 'gradle'
    - name: Assemble
      run: ./gradlew jpos:assemble --info
      env:
        TERM: dumb
    - name: Check
      run: ./gradlew jpos:check --info
      env:
        TERM: dumb
    - name: Upload test results
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}-java-${{ matrix.java }}
        path: jpos/build/reports/tests/*
    # Dependency scans run separately: the legacy scanner uses an unavailable NVD feed.
#    - name: Dependency Check Analyze
#      run: ./gradlew jpos:dependencyCheckAnalyze --info
#      env:
#        TERM: dumb

